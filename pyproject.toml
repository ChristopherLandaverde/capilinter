[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capilinter"
version = "0.3.0"
description = "Offline validator for Meta Conversions API (CAPI) payloads: schema, PII hashing, deduplication keys, and an estimated match-quality score."
readme = "README.md"
authors = [{ name = "Christopher Landaverde", email = "christopher@focosys.io" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://focosys.io"

[project.scripts]
capilinter = "capilinter.cli:main"

[tool.setuptools]
packages = ["capilinter"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "bandit[toml]>=1.7", "build>=1.2"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long user-facing message strings; ruff format owns line length
    "RUF001",  # glyphs (×, □, ✓) and fullwidth-digit test data are intentional
]

[tool.mypy]
files = ["capilinter"]
strict = true
python_version = "3.10"

[tool.bandit]
exclude_dirs = ["tests"]
